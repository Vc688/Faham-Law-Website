[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # GITHUB_BRANCH ("main") and GITHUB_REPO aren't secrets, and "main" appears throughout the code,
  # so exclude them from Netlify's secret scan. GITHUB_TOKEN etc. are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_BRANCH,GITHUB_REPO"

# ---- Redirects: keep old Squarespace URLs working ----
[[redirects]]
  from = "/new-page"
  to = "/file-a-trademark"
  status = 301
  force = true

[[redirects]]
  from = "/contact-faham"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/corporate-counsel"
  to = "/fractional-general-counsel"
  status = 301
  force = true

[[redirects]]
  from = "/insights/category/*"
  to = "/insights"
  status = 302

# ---- Headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
